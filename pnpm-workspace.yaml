packages:
  - packages/dsh-plugin-desktop
  - packages/dsh-plugin-desktop-connection

# pnpm blocks dependency build scripts by default; allow the native modules the
# DSH subprocess/terminal capability needs at runtime.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  '@pnpm/exe': true
  esbuild: true
  electron: true
  koffi: true
  node-pty: true
  protobufjs: true
  electron-winstaller: false

# pnpm's default minimum-release-age (24h) would filter a fresh @deepseek-ai
# release out of the `next` dist-tag resolution (falling back to the previous
# family) and block a fresh dshmarket; the desktop tracks newest upstream by
# design, so both are excluded from the release-age check.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'
  - dshmarket@1.12.1

# app-builder-lib needs @electron/get >= 3.1.0 for ElectronDownloadCacheMode;
# the ^3.0.0 range otherwise resolves to 3.0.0 which lacks the enum.
overrides:
  'app-builder-lib>@electron/get': ^3.1.0
